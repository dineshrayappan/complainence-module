<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="qmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Outer Ring Shield Accent -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#qmsGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- Textile Spool / Diamond Core Symbol -->
  <g filter="url(#glow)">
    <!-- Shield / Garment Badge Path -->
    <path d="M32 10 L48 18 V34 C48 44 41 51 32 54 C23 51 16 44 16 34 V18 Z" fill="url(#qmsGrad)" opacity="0.9" />

    <!-- Contrasting Inner Shield Shadow -->
    <path d="M32 13 L45 20 V33 C45 42 39 48 32 50.8 C25 48 19 42 19 33 V20 Z" fill="#0f172a" opacity="0.45" />

    <!-- Crisp Quality Checkmark -->
    <path d="M25 31.5 L30 36.5 L40 24.5" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
